<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" role="img" aria-labelledby="title desc">
  <title id="title">Logo CNI</title>
  <desc id="desc">Triangle bleu avec les lettres CNI en jaune</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="1.5" flood-color="#111111" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="260" height="180" fill="transparent"/>

  <polygon points="38,132 130,23 222,132" fill="#56b9e9"/>

  <polygon points="104,104 148,55 157,61 113,110" fill="#111111"/>
  <polygon points="119,112 164,63 173,69 128,118" fill="#ffffff"/>
  <polygon points="134,120 179,71 189,77 144,126" fill="#111111"/>
  <polygon points="150,128 195,79 205,85 160,134" fill="#f6df00"/>

  <g filter="url(#shadow)" transform="rotate(-24 115 105)">
    <text x="66" y="122" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" fill="#f6df00">CNI</text>
  </g>

  <text x="130" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#171717">المركز الوطني للإعلامية</text>
</svg>
